<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip History - TripTrace</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .search-bar {
      position: relative;
      margin-bottom: 16px;
    }
    .search-bar input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid var(--dark-border);
      border-radius: 50px;
      color: var(--white);
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all 0.3s;
    }
    .search-bar input:focus {
      border-color: var(--primary);
      background: rgba(108,99,255,0.08);
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.25); }
    .search-icon {
      position: absolute;
      left: 16px; top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
    }
    .filter-tabs {
      display: flex; gap: 8px;
      overflow-x: auto; padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-tab {
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; border: none;
      white-space: nowrap;
      transition: all 0.2s;
      font-family: 'Poppins', sans-serif;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      border: 1px solid var(--dark-border);
    }
    .filter-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    .trip-card {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex; gap: 14px;
      align-items: flex-start;
      transition: transform 0.2s, box-shadow 0.2s;
      animation: fadeInUp 0.4s ease;
      cursor: pointer;
    }
    .trip-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .trip-thumb {
      width: 72px; height: 72px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      border: 2px solid var(--dark-border);
    }
    .trip-thumb-placeholder {
      width: 72px; height: 72px;
      border-radius: 14px;
      background: linear-gradient(135deg,
        rgba(108,99,255,0.2),
        rgba(108,99,255,0.4));
      display: flex; align-items: center;
      justify-content: center;
      font-size: 28px; flex-shrink: 0;
    }
    .trip-info { flex: 1; min-width: 0; }
    .trip-name {
      font-size: 15px; font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trip-location {
      font-size: 12px; color: var(--primary);
      margin-bottom: 3px;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
    }
    .trip-meta {
      display: flex; gap: 10px;
      align-items: center; flex-wrap: wrap;
    }
    .trip-date {
      font-size: 11px; color: var(--text-muted);
    }
    .trip-category {
      font-size: 10px; font-weight: 700;
      background: rgba(108,99,255,0.15);
      color: var(--primary);
      padding: 2px 8px; border-radius: 20px;
      text-transform: uppercase;
    }
    .trip-rating { font-size: 11px; }
    .trip-expense {
      font-size: 11px; color: var(--accent);
      font-weight: 600;
    }
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .empty-icon {
      font-size: 64px; display: block;
      margin-bottom: 16px;
    }
    .empty-state h3 {
      font-size: 18px; font-weight: 700;
      color: var(--white); margin-bottom: 8px;
    }
    .empty-state p {
      font-size: 14px; margin-bottom: 24px;
    }
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-bottom: 20px;
    }
    .stat-mini {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
    }
    .stat-mini .stat-val {
      font-size: 20px; font-weight: 800;
      color: var(--primary);
      display: block;
    }
    .stat-mini .stat-lbl {
      font-size: 10px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .page-title {
      font-size: 20px; font-weight: 700;
      margin-bottom: 16px;
      display: flex; align-items: center;
      justify-content: space-between;
    }
    .trip-count-badge {
      background: var(--primary);
      color: white; font-size: 11px;
      font-weight: 700; padding: 3px 10px;
      border-radius: 20px;
    }
  </style>
</head>
<body class="app-body">
<div class="app-layout">

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="nav-brand">
      <span class="brand-icon">🌍</span>
      <div>
        <div class="nav-brand .brand-text">Trip<span style="color:var(--primary)">Trace</span></div>
        <div class="nav-subtitle">Your travel memories</div>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-sm btn-outline" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <!-- PAGE CONTENT -->
  <div class="page-content">

    <!-- Stats Row -->
    <div class="stats-row">
      <div class="stat-mini">
        <span class="stat-val" id="total-trips">0</span>
        <span class="stat-lbl">Trips</span>
      </div>
      <div class="stat-mini">
        <span class="stat-val" id="total-spent">₹0</span>
        <span class="stat-lbl">Spent</span>
      </div>
      <div class="stat-mini">
        <span class="stat-val" id="top-category">--</span>
        <span class="stat-lbl">Fav Type</span>
      </div>
    </div>

    <!-- Page Title -->
    <div class="page-title">
      📋 Trip History
      <span class="trip-count-badge" id="trip-count">0</span>
    </div>

    <!-- Search -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input"
        placeholder="Search trips..."
        oninput="filterTrips()"/>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="filter-tab active" onclick="setFilter('all', this)">All</button>
      <button class="filter-tab" onclick="setFilter('adventure', this)">🏔️ Adventure</button>
      <button class="filter-tab" onclick="setFilter('beach', this)">🏖️ Beach</button>
      <button class="filter-tab" onclick="setFilter('cultural', this)">🏛️ Cultural</button>
      <button class="filter-tab" onclick="setFilter('food', this)">🍜 Food</button>
      <button class="filter-tab" onclick="setFilter('nature', this)">🌿 Nature</button>
      <button class="filter-tab" onclick="setFilter('road-trip', this)">🚗 Road Trip</button>
    </div>

    <!-- Trip List -->
    <div id="trip-list"></div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <a href="logger.html" class="nav-item">
      <span class="nav-icon">➕</span> Log Trip
    </a>
    <a href="history.html" class="nav-item active">
      <span class="nav-icon">📋</span> History
    </a>
    <a href="map.html" class="nav-item">
      <span class="nav-icon">🗺️</span> Map
    </a>
  </div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/history.js"></script>
</body>
</html>
