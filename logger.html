<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log Trip - TripTrace</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .weather-box {
      background: linear-gradient(135deg, rgba(108,99,255,0.15), rgba(67,233,123,0.08));
      border: 1px solid rgba(108,99,255,0.25);
      border-radius: 16px;
      padding: 16px;
      margin-top: 12px;
      display: none;
    }
    .weather-box.show { display: block; }
    .weather-info {
      display: flex; align-items: center; gap: 12px;
    }
    .weather-icon { font-size: 36px; }
    .weather-details h3 { font-size: 18px; font-weight: 700; }
    .weather-details p { font-size: 12px; color: var(--text-muted); }
    #map {
      width: 100%; height: 200px;
      border-radius: 14px; margin-top: 12px;
      border: 1px solid var(--dark-border);
    }
    .location-display {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--dark-border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .photo-upload-box {
      border: 2px dashed rgba(108,99,255,0.4);
      border-radius: 14px; padding: 28px;
      text-align: center; cursor: pointer;
      transition: all 0.3s;
      background: rgba(108,99,255,0.05);
    }
    .photo-upload-box:hover {
      border-color: var(--primary);
      background: rgba(108,99,255,0.1);
    }
    .photo-upload-box .upload-icon { font-size: 36px; display: block; margin-bottom: 8px; }
    .photo-upload-box p { font-size: 13px; color: var(--text-muted); }
    .photo-preview {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px;
    }
    .photo-preview img {
      width: 80px; height: 80px;
      object-fit: cover; border-radius: 10px;
      border: 2px solid var(--dark-border);
    }
    .card-title {
      font-size: 14px; font-weight: 600;
      color: var(--primary); margin-bottom: 14px;
      display: flex; align-items: center; gap: 6px;
    }
    .expense-row {
      display: flex; gap: 10px; margin-bottom: 10px;
    }
    .expense-row .input-field { flex: 1; }
    .btn-remove {
      background: rgba(255,101,132,0.15);
      border: none; color: var(--secondary);
      border-radius: 10px; padding: 0 14px;
      cursor: pointer; font-size: 16px;
      font-family: 'Poppins', sans-serif;
    }
    .category-select {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.06);
      border: 1.5px solid var(--dark-border);
      border-radius: 12px;
      color: var(--white);
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: all 0.3s;
    }
    .category-select:focus {
      border-color: var(--primary);
      background: rgba(108,99,255,0.08);
    }
    .category-select option { background: #12122A; }
    .total-expense {
      background: rgba(67,233,123,0.1);
      border: 1px solid rgba(67,233,123,0.2);
      border-radius: 12px; padding: 14px;
      text-align: center; margin-top: 12px;
    }
    .total-expense .total-label { font-size: 12px; color: var(--text-muted); }
    .total-expense .total-amount {
      font-size: 24px; font-weight: 800; color: var(--accent);
    }
    .page-title {
      font-size: 20px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
  </style>
</head>
<body class="app-body">
<div class="app-layout">

  <!-- TOP NAV -->
  <div class="top-nav">
    <div class="nav-brand">
      <span class="brand-icon">🌍</span>
      <div>
        <div class="nav-brand .brand-text">Trip<span style="color:var(--primary)">Trace</span></div>
        <div class="nav-subtitle" id="user-greeting">Welcome back!</div>
      </div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-sm btn-outline" onclick="logoutUser()">Logout</button>
    </div>
  </div>

  <!-- PAGE CONTENT -->
  <div class="page-content">
    <div class="page-title">✈️ Log New Trip</div>

    <!-- TRIP DETAILS -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">📝 Trip Details</div>
      <div class="input-group">
        <label>Trip Name *</label>
        <input type="text" id="trip-name" placeholder="e.g. Weekend in Ooty" class="input-field"/>
      </div>
      <div class="input-group">
        <label>Destination</label>
        <input type="text" id="trip-destination" placeholder="e.g. Ooty, Tamil Nadu" class="input-field"/>
      </div>
      <div class="input-group">
        <label>Date of Visit *</label>
        <input type="date" id="trip-date" class="input-field"/>
      </div>
      <div class="input-group">
        <label>Trip Category</label>
        <select id="trip-category" class="category-select">
          <option value="adventure">🏔️ Adventure</option>
          <option value="beach">🏖️ Beach</option>
          <option value="cultural">🏛️ Cultural</option>
          <option value="food">🍜 Food Tour</option>
          <option value="nature">🌿 Nature</option>
          <option value="religious">🕌 Religious</option>
          <option value="road-trip">🚗 Road Trip</option>
          <option value="other">✈️ Other</option>
        </select>
      </div>
      <div class="input-group">
        <label>Notes / Description</label>
        <textarea id="trip-notes" placeholder="What made this trip special? Share your experience..." class="input-field"></textarea>
      </div>
      <div class="input-group">
        <label>Trip Rating</label>
        <select id="trip-rating" class="category-select">
          <option value="5">⭐⭐⭐⭐⭐ Amazing!</option>
          <option value="4">⭐⭐⭐⭐ Great</option>
          <option value="3">⭐⭐⭐ Good</option>
          <option value="2">⭐⭐ Average</option>
          <option value="1">⭐ Poor</option>
        </select>
      </div>
    </div>

    <!-- LOCATION + MAP -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">📍 Location</div>
      <button onclick="getLocation()" class="btn btn-primary btn-full">
        📡 Detect My Current Location
      </button>
      <div class="location-display" id="location-display">
        📍 Location will appear here after detection
      </div>
      <div id="map"></div>

      <!-- Weather -->
      <div class="weather-box" id="weather-box">
        <div class="weather-info">
          <div class="weather-icon" id="weather-icon">🌤️</div>
          <div class="weather-details">
            <h3 id="weather-temp">--°C</h3>
            <p id="weather-desc">Loading weather...</p>
            <p id="weather-location">--</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PHOTO UPLOAD -->
<div class="card" style="margin-bottom:16px;">
  <div class="card-title">📸 Trip Photos</div>
  <div style="text-align:center; padding:20px;
              color:var(--text-muted); font-size:13px;">
    📸 Photo upload coming soon!
  </div>
</div>

    <!-- EXPENSE TRACKER -->
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">💸 Expense Tracker</div>
      <div id="expense-list"></div>
      <button onclick="addExpenseRow()" class="btn btn-outline btn-full" style="margin-top:8px;">
        + Add Expense
      </button>
      <div class="total-expense">
        <div class="total-label">Total Trip Cost</div>
        <div class="total-amount" id="total-amount">₹0</div>
      </div>
    </div>

    <!-- SAVE BUTTON -->
    <button onclick="saveTrip()" class="btn btn-primary btn-full btn-lg" id="save-btn">
      💾 Save Trip
    </button>
    <div id="save-msg" style="text-align:center; margin-top:12px; font-size:13px;"></div>

  </div>

  <!-- BOTTOM NAV -->
  <div class="bottom-nav">
    <a href="logger.html" class="nav-item active">
      <span class="nav-icon">➕</span> Log Trip
    </a>
    <a href="history.html" class="nav-item">
      <span class="nav-icon">📋</span> History
    </a>
    <a href="map.html" class="nav-item">
      <span class="nav-icon">🗺️</span> Map
    </a>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="js/firebase.js"></script>
<script src="js/auth.js"></script>
<script src="js/weather.js"></script>
<script src="js/expense.js"></script>

<!-- Google Maps — Replace YOUR_API_KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap" async defer></script>
<script src="js/logger.js"></script>

<script>
  // Show user greeting
  auth.onAuthStateChanged((user) => {
    if (user) {
      document.getElementById('user-greeting').innerText =
        'Hello, ' + (user.displayName || 'Traveler') + '! 👋';
    } else {
      window.location.href = 'login.html';
    }
  });

  // Toast function
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }
</script>
</body>
</html>
